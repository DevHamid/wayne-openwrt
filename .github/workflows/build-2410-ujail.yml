name: Build Wayne 24.10 debug image with ujail compatibility fix

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful vendor-kernel artifact run to reuse
        required: true
        default: '44151039361'

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and emulation prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev rsync unzip zlib1g-dev file wget curl cpio qemu-user-static zstd
      - name: Verify kernel artifact provenance and download
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('source-run.json'))
          assert r['conclusion']=='success', 'kernel artifact run did not succeed'
          assert r['head_sha']=='3ad6c6307ed16bbef21353bc342ec3f1d1138f0f', 'unexpected vendor-kernel provenance'
          print('Reusing tested kernel artifact:', r['html_url'])
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n wayne-openwrt -D main-artifact
      - name: Download and verify matching 24.10.4 SDK
        run: |
          set -euo pipefail
          URL=https://downloads.immortalwrt.org/releases/24.10.4/targets/armsr/armv8/immortalwrt-sdk-24.10.4-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          wget -q "$URL" -O sdk.tar.zst
          echo 'f8b984d409d3ec5ea0e5ea07d1a59dadcd38bfb908e9059eff98e59a2f885a75  sdk.tar.zst' | sha256sum -c -
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          test -x sdk/staging_dir/toolchain-aarch64_generic_gcc-13.3.0_musl/bin/aarch64-openwrt-linux-musl-gcc
          test -d sdk/staging_dir/target-aarch64_generic_musl/usr/include
          test -d sdk/staging_dir/target-aarch64_generic_musl/usr/lib
      - name: Patch the exact pinned 24.10 ujail source
        run: |
          set -euo pipefail
          mkdir -p procd-src/jail
          curl -fL --retry 3 https://raw.githubusercontent.com/openwrt/procd/42d3937654508b04da64969f9d764ac2ec411904/jail/capabilities.c -o procd-src/jail/capabilities.c
          mkdir -p procd-src/include
          for h in jail/capabilities.h jail/cgroups.h jail/elf.h jail/fs.h jail/jail.h jail/log.h jail/netifd.h jail/seccomp-oci.h; do
            mkdir -p "procd-src/$(dirname "$h")"
            curl -fL --retry 3 "https://raw.githubusercontent.com/openwrt/procd/42d3937654508b04da64969f9d764ac2ec411904/$h" -o "procd-src/$h"
          done
          curl -fL --retry 3 https://raw.githubusercontent.com/openwrt/procd/42d3937654508b04da64969f9d764ac2ec411904/capabilities-names.h -o procd-src/capabilities-names.h
          patch --dry-run -p1 -d procd-src < patches/procd-ujail-kernel-cap-limit.patch
          patch -p1 -d procd-src < patches/procd-ujail-kernel-cap-limit.patch
          grep -q 'kernel does not support capability %d; skipping' procd-src/jail/capabilities.c
      - name: Cross-build ujail against the SDK target libraries
        run: |
          set -euo pipefail
          SDK="$PWD/sdk"
          TARGET="$SDK/staging_dir/target-aarch64_generic_musl"
          CC="$SDK/staging_dir/toolchain-aarch64_generic_gcc-13.3.0_musl/bin/aarch64-openwrt-linux-musl-gcc"
          for h in libubox/blobmsg.h libubox/blobmsg_json.h libubus.h uci.h; do
            test -f "$TARGET/usr/include/$h" || { echo "missing SDK target header: $h"; exit 1; }
          done
          for l in ubox ubus uci blobmsg_json json-c; do
            find "$TARGET/usr/lib" "$TARGET/lib" -maxdepth 1 -name "lib$l.so*" -print -quit 2>/dev/null | grep -q . || { echo "missing SDK target library: $l"; exit 1; }
          done
          mkdir -p built-packages
          "$CC" --sysroot="$TARGET" -Os -Wall -Werror -std=gnu99 \
            -I"$TARGET/usr/include" -Iprocd-src/jail -Iprocd-src \
            -o built-packages/ujail \
            procd-src/jail/jail.c procd-src/jail/cgroups.c procd-src/jail/cgroups-bpf.c \
            procd-src/jail/elf.c procd-src/jail/fs.c procd-src/jail/capabilities.c \
            procd-src/jail/netifd.c \
            -L"$TARGET/usr/lib" -L"$TARGET/lib" -lubox -lubus -luci -lblobmsg_json -ljson-c
          file built-packages/ujail
          readelf -h built-packages/ujail | grep 'Machine:.*AArch64'
          readelf -d built-packages/ujail | grep -E 'NEEDED.*(ubox|ubus|uci|blobmsg|json)'
          cp procd-src/jail/capabilities.c built-packages/capabilities.c
      - name: Assemble patched debug rootfs
        run: |
          set -euo pipefail
          python3 scripts/test-2410.py -v
          python3 scripts/assemble-2410.py --source main-artifact --out build/openwrt --source-run "$SOURCE_RUN"
          python3 scripts/install-ujail-ipk.py "$(find built-packages -name 'procd-ujail_*.ipk' -print -quit)" build/openwrt
          mkdir -p build/openwrt/usr/lib/opkg/info
          cp "$(find built-packages -name 'procd-ujail_*.ipk' -print -quit)" build/openwrt/usr/lib/opkg/info/procd-ujail.ipk
          cp build/openwrt/etc/wayne-build.json build/BUILD-INFO.json
      - name: Exercise console, tools, scripts and patched ujail under ARM64 emulation
        run: |
          set -euo pipefail
          R="$PWD/build/openwrt"
          sudo cp /usr/bin/qemu-aarch64-static "$R/usr/bin/"
          for script in /usr/libexec/login.sh /root/screen.sh /etc/init.d/rmtfs /etc/init.d/burnin-guard /etc/init.d/modem-boot-trigger; do
            sudo chroot "$R" /usr/bin/qemu-aarch64-static /bin/busybox-static sh -n "$script"
          done
          sudo chroot "$R" /usr/bin/qemu-aarch64-static /usr/sbin/iw --version
          sudo chroot "$R" /usr/bin/qemu-aarch64-static /usr/bin/iwinfo --help >/dev/null 2>&1 || [ "$?" -eq 1 ]
          sudo chroot "$R" /usr/bin/qemu-aarch64-static /usr/sbin/hostapd -v > /tmp/hostapd-version 2>&1 || [ "$?" -eq 1 ]
          grep -q 'hostapd v' /tmp/hostapd-version
          sudo chroot "$R" /usr/bin/qemu-aarch64-static /usr/sbin/wpa_supplicant -v
          sudo chroot "$R" /usr/bin/qemu-aarch64-static /sbin/ujail --help > /tmp/ujail-help 2>&1 || [ "$?" -eq 1 ]
          grep -q 'ujail' /tmp/ujail-help
          sudo rm "$R/usr/bin/qemu-aarch64-static"
      - name: Pack, inspect and verify debug image
        run: |
          set -euo pipefail
          git clone --depth=1 --branch master-kernel-build-2022 https://android.googlesource.com/platform/system/tools/mkbootimg mkboot
          curl -fL --retry 3 https://github.com/DevHamid/Kernel_Action/raw/c947c2c04f1445437f507f2b138c34e918d3d54f/boot/boot.img -o donor-boot.img
          KERNEL=$(find main-artifact -name Image.gz-dtb -print -quit)
          (cd build/openwrt && find . -print0 | cpio --null -o --format=newc --owner=0:0 2>/dev/null | gzip -9 > ../openwrt-2410-debug-initramfs.cpio.gz)
          python3 scripts/pack-boot.py mkboot donor-boot.img "$KERNEL" build/openwrt-2410-debug-initramfs.cpio.gz build/openwrt-2410-debug-boot.img
          python3 scripts/check-2410.py build/openwrt-2410-debug-boot.img "$KERNEL" | tee build/VERIFICATION.json
          (cd build && sha256sum openwrt-2410-debug-boot.img openwrt-2410-debug-initramfs.cpio.gz > SHA256SUMS)
      - name: Upload patched debug image and package
        uses: actions/upload-artifact@v4
        with:
          name: wayne-openwrt-2410-debug-ujail-fix
          if-no-files-found: error
          path: |
            build/openwrt-2410-debug-boot.img
            build/openwrt-2410-debug-initramfs.cpio.gz
            build/BUILD-INFO.json
            build/VERIFICATION.json
            build/SHA256SUMS
            built-packages/procd-ujail_*.ipk
