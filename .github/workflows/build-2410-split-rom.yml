name: Build Wayne 24.10 split ROM

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful kernel run to reuse (no recompilation)
        required: true
        default: '44445539855'
      source_sha:
        description: Optional required headSha for the source run (pin a build)
        required: false
        default: ''
      release_tag:
        description: Release tag the ROM assets will live under; needed for an online OTA manifest (empty = offline manifest only)
        required: false
        default: ''
  push:
    # Single push block: `tags` is the only key, so a `v*` tag push triggers this
    # workflow directly (GitHub ANDs branches+paths+tags WITHIN one block, but a
    # lone key just matches that ref kind). Kept as ONE `push:` key -- a duplicate
    # `push:` key would silently drop one of them in YAML.
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  rom:
    runs-on: ubuntu-24.04
    # 25 min was enough for dispatch (source_run pre-resolved). A `v*` tag push
    # has to WAIT for the kernel build of the tagged commit to go green first
    # (same reuse-don't-rebuild contract as build.yml's release job), so allow
    # up to ~35 min of polling on top of the ~15 min assembly.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      # dispatch: caller-supplied. tag push: empty inputs, so fall back to the
      # pushed tag name (refs/tags/vX -> vX) for the OTA manifest + release.
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio zip unzip

      # A tag push carries no `source_run` input, so resolve it from the tag's
      # own commit: reuse the successful kernel (`wayne-openwrt`) artifact built
      # for this exact SHA. Mirrors build.yml's release job -- one commit = one
      # kernel compile, the ROM job never recompiles. Filter headBranch=="main"
      # because pushing the tag ALSO fires build.yml (it lists tags: ['v*']),
      # but both its jobs skip there -- that run concludes "success" yet builds
      # nothing, and being newer it would otherwise be picked first (gh run list
      # is newest-first), yielding "no valid artifacts found to download".
      - name: Resolve source kernel run (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          echo "Tag $GITHUB_REF_NAME -> commit $SHA; waiting for its kernel build."
          RUN_ID=""
          for i in $(seq 1 70); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" \
              --workflow build.yml --limit 30 \
              --json databaseId,event,status,conclusion,headBranch \
              --jq '[.[] | select(.event=="push" and .headBranch=="main"
                                  and .conclusion=="success"
                                  and .databaseId != (env.GITHUB_RUN_ID|tonumber))][0].databaseId' \
              2>/dev/null || true)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Reusing kernel build run $RUN_ID"; break
            fi
            echo "[$((i*30))s] still waiting for a green kernel build of $SHA…"
            sleep 30
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful build.yml run found for $SHA after ~35 min. Push main (green kernel build) first, then tag that commit."
            exit 1
          fi
          echo "SOURCE_RUN=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify source run and kernel provenance
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['conclusion'] == 'success', 'Source run did not pass'
          want = os.environ.get('SOURCE_SHA', '').strip()
          if want:
              assert run['headSha'] == want, f"source headSha {run['headSha']} != {want}"
          print('Reusing kernel from', run['headSha'])
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n wayne-openwrt -D source
          KERNEL=$(find source -name Image.gz-dtb -print -quit)
          test -n "$KERNEL"
          echo "KERNEL=$KERNEL" >> "$GITHUB_ENV"

      - name: Check kernel gates (QRTR registry)
        run: |
          set -euo pipefail
          # build/kernel-source.txt rides inside the reused artifact and carries
          # the value the build job's own capability step recorded -- the same
          # file the release job refuses on. Surface it here so a registry-less
          # kernel fails before assembly instead of after a full ROM build.
          # NB: find -print -quit, never `find | head`: under pipefail head's
          # early exit SIGPIPEs find and the pipeline reports a false failure.
          KS="$(find source -name kernel-source.txt -print -quit)"
          [ -n "$KS" ] || { echo "::error::kernel-source.txt missing from the source artifact"; exit 1; }
          cat "$KS"
          if ! grep -qx 'qrtr_registry=present' "$KS"; then
            echo "::warning::source kernel has no in-kernel QRTR service registry."
            echo "Modem stability no longer depends on it: the diag-starvation root cause was 'nobody reads /dev/diag on OpenWrt', fixed by the persistent /dev/diag reader (repo commit 014b0572), and the clean adios-wayne kernel with that reader is verified stable on device (35+ min, F=0 S=0, across a reboot) with QRTR service discovery served by the userspace qrtr-ns."
            # adios-wayne (the shipping baseline) is registry-absent BY DESIGN --
            # discovery is served by userspace qrtr-ns. Failing closed here would
            # block EVERY v* release built from the verified baseline, so this is
            # a warning, not a gate: proceed on BOTH dispatch and tag push. The
            # real modem-stability gate is the on-device soak, re-verified after
            # every flash.
            echo "Proceeding with the assembly (registry-absent baseline is the shipping default); the modem-stability gate is the on-device soak, re-verified after every flash."
          else
            echo 'PASS: QRTR service registry present in the reused kernel'
          fi

      - name: Test assembly helpers
        run: |
          python3 scripts/test-2410.py -v
          sh scripts/test-ota.sh
          sh scripts/test-usb-gadget-bringup.sh

      - name: Build wayne-diagd userspace (static aarch64, /dev/diag drain)
        run: |
          set -euo pipefail
          # The modem's diag task starves ("dog_hb: Task starvation: diag" ->
          # ERR_FATAL ~90s crash loop) when nothing drains /dev/diag. The v2
          # (LKGeek) diagchar driver rejects a raw read until the DIAG ioctl
          # msg-mask handshake is done, so a bare `cat /dev/diag` can never
          # satisfy it (diag_copy_to_user_msg_mask err -22). wayne-diagd does
          # the handshake (REMOTE_DEV/SWITCH_LOGGING/COMMAND_REG) then drains.
          # assemble-2410.py stages build/diagd-out/wayne-diagd into the rootfs
          # ONLY if the binary exists -- so this step must run BEFORE assemble,
          # otherwise the diag-reader init silently falls back to `cat`.
          chmod +x scripts/build-diagd.sh
          ./scripts/build-diagd.sh "$GITHUB_WORKSPACE/build/diagd-out"
          test -x "$GITHUB_WORKSPACE/build/diagd-out/wayne-diagd"

      - name: Assemble ImmortalWrt 24.10.4 system rootfs
        run: |
          set -euo pipefail
          python3 scripts/assemble-2410.py --source source --out build/openwrt --source-run "$SOURCE_RUN"
          R=build/openwrt
          install -D -m 0755 overlay-common/usb-gadget.sh "$R/usr/lib/wayne/usb-gadget.sh"
          test -x "$R/usr/lib/wayne/usb-gadget.sh"
          grep -Fq '/usr/lib/wayne/usb-gadget.sh' "$R/etc/init.d/usb-gadget"
          test -x "$R/sbin/init" || test -L "$R/sbin/init"
          test -x "$R/root/screen.sh"
          test -x "$R/usr/sbin/wayne-ota"
          test -L "$R/etc/rc.d/S99burnin-guard"
          KV=
          for d in "$R"/lib/modules/4.19*; do
            [ -d "$d" ] && { KV=${d##*/}; break; }
          done
          test -n "$KV"
          test -f "$R/lib/modules/$KV/kernel/drivers/video/backlight/qcom-spmi-wled.ko"
          test -f "$R/lib/modules/$KV/kernel/drivers/soc/qcom/modem-boot.ko"
          python3 -c "import json;d=json.load(open('$R/etc/wayne-build.json'));assert d['rootfs']=='24.10.4',d['rootfs']"
          echo "KV=$KV" >> "$GITHUB_ENV"

      - name: Stage modem firmware into the system rootfs
        run: |
          set -euo pipefail
          R=build/openwrt
          mkdir -p "$R/lib/firmware"
          cp -a modem-firmware/. "$R/lib/firmware/"
          for f in "$R"/lib/firmware/MBA.MBN "$R"/lib/firmware/MODEM.MDT "$R"/lib/firmware/MODEM.B??; do
            [ -e "$f" ] && cp "$f" "$R/lib/firmware/$(basename "$f" | tr 'A-Z' 'a-z')"
          done
          test -f "$R/lib/firmware/modem.mdt"
          test -f "$R/lib/firmware/mba.mbn"
          test -f "$R/lib/firmware/wlan/qca_cld/wlanmdsp.mbn"
          echo "modem + wlan firmware staged"

      - name: Assemble tiny system bootstrap
        run: |
          set -euo pipefail
          B=build/bootstrap
          mkdir -p "$B/bin" "$B/dev" "$B/proc" "$B/sys" "$B/tmp" "$B/etc" "$B/mnt"
          cp build/openwrt/bin/busybox-static "$B/bin/busybox-static"
          chmod +x "$B/bin/busybox-static"
          for applet in sh basename cat cp cut date dd echo grep gzip head ln ls mkdir mknod mount mv rm sed sha256sum sleep switch_root tar umount; do
            ln -sf busybox-static "$B/bin/$applet"
          done
          cp overlay-system/init "$B/init"
          chmod +x "$B/init"
          cp overlay-common/usb-gadget.sh "$B/usb-gadget.sh"
          chmod +x "$B/usb-gadget.sh"
          grep -q 'exec switch_root' "$B/init"
          (cd "$B" && find . -print0 | cpio --null -o --format=newc --owner=0:0 2>/dev/null | gzip -9 > ../bootstrap-initramfs.cpio.gz)
          ls -lh build/bootstrap-initramfs.cpio.gz

      - name: Pack and verify boot image
        run: |
          set -euo pipefail
          git clone --depth=1 --branch master-kernel-build-2022 \
            https://android.googlesource.com/platform/system/tools/mkbootimg mkboot
          curl -fL --retry 3 -o donor-boot.img \
            https://github.com/DevHamid/Kernel_Action/raw/c947c2c04f1445437f507f2b138c34e918d3d54f/boot/boot.img
          python3 scripts/pack-boot.py mkboot donor-boot.img "$KERNEL" \
            build/bootstrap-initramfs.cpio.gz build/rom-boot.img
          python3 scripts/check-pack.py mkboot donor-boot.img "$KERNEL" \
            build/bootstrap-initramfs.cpio.gz
          BOOT_SZ=$(stat -c%s build/rom-boot.img)
          echo "boot-size gate: rom-boot.img=$BOOT_SZ bytes (ceiling 33554432)"
          test "$BOOT_SZ" -lt 33554432

      - name: Assemble flashable ROM zip
        run: |
          set -euo pipefail
          mkdir -p build/rom/boot build/rom/system build/rom/META-INF/com/google/android
          cp build/rom-boot.img build/rom/boot/boot.img
          tar -czf build/rom/system/rootfs.tar.gz \
            --exclude=./proc --exclude=./sys --exclude=./dev --exclude=./tmp \
            --exclude=./mnt --exclude=./init --exclude=./rom --exclude=./usb-gadget.sh \
            -C build/openwrt .
          T=build/rom/system/rootfs.tar.gz
          tar -tzf "$T" > build/rom-rootfs.list
          for entry in ./sbin/init ./usr/lib/wayne/usb-gadget.sh ./root/screen.sh ./usr/sbin/wayne-ota \
                       ./etc/rc.d/S99burnin-guard ./etc/rc.d/S25diag-reader ./etc/rc.d/S60dbus ./etc/rc.d/S70modemmanager ./etc/init.d/diag-reader ./lib/firmware/wlan/qca_cld/wlanmdsp.mbn ./usr/sbin/ModemManager ./www/luci-static/resources/view/modemmanager/status.js \
                       ./lib/firmware/modem.mdt ./lib/firmware/mba.mbn; do
            grep -Fxq "$entry" build/rom-rootfs.list || { echo "::error::rootfs missing $entry"; exit 1; }
          done
          tar -xzf "$T" -O ./etc/wayne-build.json > build/wayne-build.json
          grep -q '"rootfs": "24.10.4"' build/wayne-build.json
          cp recovery/update-binary build/rom/META-INF/com/google/android/update-binary
          cp recovery/updater-script build/rom/META-INF/com/google/android/updater-script
          (cd build/rom && zip -qr ../wayne-openwrt-rom.zip .)
          python3 - <<'PY'
          import hashlib, zipfile
          z = zipfile.ZipFile('build/wayne-openwrt-rom.zip')
          assert z.testzip() is None
          boot = z.read('boot/boot.img')
          assert boot == open('build/rom-boot.img', 'rb').read()
          print('ZIP entries:', len(z.namelist()))
          print('sha256:', hashlib.sha256(open('build/wayne-openwrt-rom.zip','rb').read()).hexdigest())
          PY
          ls -lh build/wayne-openwrt-rom.zip

      - name: Emit OTA manifest
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG:-$(git rev-parse --short HEAD)}"
          echo "version=$VERSION" > build/MANIFEST
          cat build/MANIFEST
          # wayne-ota expects boot_url/rootfs_url to be empty when released offline
          # (file:// or bare path). Scripts/make-manifest.sh handles both cases.
          scripts/make-manifest.sh "$VERSION" "${RELEASE_TAG:-}" build/rom-boot.img build/rom/system/rootfs.tar.gz \
            > build/MANIFEST.tmp && mv build/MANIFEST.tmp build/MANIFEST
          cat build/MANIFEST
          # Validate the manifest matches the actual files (same checks as wayne-ota).
          for key in version boot_sha256 rootfs_sha256 boot_url rootfs_url; do
            grep "^${key}=" build/MANIFEST || { echo "::error::manifest missing $key"; exit 1; }
          done
          mval() { awk -F= -v k="$1" '$1==k {sub(/^[^=]*=/,""); print; exit}' build/MANIFEST; }
          [ "$(mval boot_sha256)" = "$(sha256sum build/rom-boot.img | cut -d' ' -f1)" ] \
            || { echo "::error::boot_sha256 mismatch"; exit 1; }
          [ "$(mval rootfs_sha256)" = "$(sha256sum build/rom/system/rootfs.tar.gz | cut -d' ' -f1)" ] \
            || { echo "::error::rootfs_sha256 mismatch"; exit 1; }
          tar -tzf build/rom/system/rootfs.tar.gz > build/ota-rootfs.list \
            || { echo "::error::ota rootfs unreadable"; exit 1; }
          grep -Fxq ./sbin/init build/ota-rootfs.list || { echo "::error::ota rootfs missing sbin/init"; exit 1; }
          [ -n "$RELEASE_TAG" ] || echo "::warning::no release_tag: MANIFEST URLs empty, OTA is offline only"
          echo "MANIFEST written: $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: wayne-openwrt-2410-rom
          if-no-files-found: error
          path: |
            build/wayne-openwrt-rom.zip
            build/rom-boot.img
            build/MANIFEST
            build/rom/system/rootfs.tar.gz
            build/bootstrap-initramfs.cpio.gz

      # v* TAG push: docs.yml's `changelog` job is the SOLE owner of the release
      # body (generated release notes). This workflow only ATTACHES the flashable
      # ROM assets to the release docs.yml created -- it never creates the release
      # nor writes the body, so the two never both own it. Assets may be uploaded
      # before docs.yml has created the release, so poll for it, then attach.
      - name: Attach ROM to the release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          for i in $(seq 1 40); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists; uploading ROM assets"
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                build/wayne-openwrt-rom.zip \
                build/rom-boot.img \
                build/MANIFEST \
                build/rom/system/rootfs.tar.gz
              exit 0
            fi
            echo "[$((i*15))s] release $TAG not created yet (docs.yml owns the body)…"
            sleep 15
          done
          echo "::warning::release $TAG not found after ~10 min; ROM artifact is still available under this workflow run's artifacts."
      - name: Publish release (dispatch with release_tag only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          body: |
            Wayne OpenWrt 24.10.4 ROM for Xiaomi Mi 6X (wayne).
            Built from source_run ${{ inputs.source_run }}.
            ```
            Kernel: $(git rev-parse --short HEAD)
            Source: ${{ inputs.source_run }}
            ```
          files: |
            build/wayne-openwrt-rom.zip
            build/rom-boot.img
            build/MANIFEST
            build/rom/system/rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}