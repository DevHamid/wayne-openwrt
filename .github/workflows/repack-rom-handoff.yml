name: Repack Wayne split-ROM handoff

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install archive and ARM64 emulation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio qemu-user-static
      - name: Test handoff and download pinned ROM
        run: |
          set -euo pipefail
          python3 scripts/test-2410.py -v
          gh run view 44445539855 --json headSha,conclusion > source-run.json
          python3 - <<'PY'
          import json
          run = json.load(open('source-run.json'))
          assert run['headSha'] == '7b24eac854ce3d8d48ab76cc3b8ac0316ad27643'
          assert run['conclusion'] == 'success'
          PY
          gh run download 44445539855 --repo "$GITHUB_REPOSITORY" -n wayne-openwrt -D source
      - name: Rebuild bootstrap only
        run: |
          set -euo pipefail
          python3 scripts/repack-rom-handoff.py prepare source build
          qemu-aarch64-static build/bootstrap/bin/busybox-static sh -n build/bootstrap/init
          # Exercise this artifact's ARM64 shell exec semantics with the PID test.
          BB="$PWD/build/bootstrap/bin/busybox-static" python3 scripts/test-2410.py BootstrapTests.test_handoff_preserves_bootstrap_pid_arm64 -v
          (cd build/bootstrap && find . -print0 | cpio --null -o --format=newc --owner=0:0 2>/dev/null | gzip -9 > ../bootstrap-initramfs.cpio.gz)
      - name: Pack and verify unchanged kernel and system rootfs
        run: |
          set -euo pipefail
          git clone --depth=1 --branch master-kernel-build-2022 https://android.googlesource.com/platform/system/tools/mkbootimg mkboot
          python3 scripts/repack-rom-handoff.py finish source build
          (cd build && sha256sum rom-boot.img bootstrap-initramfs.cpio.gz wayne-openwrt-rom.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wayne-rom-handoff-fix
          if-no-files-found: error
          path: |
            build/rom-boot.img
            build/bootstrap-initramfs.cpio.gz
            build/wayne-openwrt-rom.zip
            build/VERIFICATION.json
            build/SHA256SUMS
