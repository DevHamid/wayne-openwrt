# Docs pipeline: generate README diagrams and release notes, deterministically.
# Separate from the build/kernel workflows on purpose — a build failure must never
# block docs, and a docs commit must not retrigger builds or itself.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/data/**"
      - "docs/diagrams/**"
      - ".github/scripts/**"
      - ".github/workflows/docs.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  LEGACY_MAP: "2410=build,CI=ci,README=docs,ota=ota,check-pack=build,wlan=wifi,modem=modem,radio=radio,wifi=wifi,usb-gadget=usb,screen=screen"

jobs:
  diagrams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the heatmap and the timeline read git history
          filter: blob:none      # history without the 1.4 GB of blobs

      - name: render diagrams
        run: |
          mkdir -p docs/diagrams
          python3 .github/scripts/render_kanban.py --src README.md --section Roadmap \
            --title "Roadmap" --out docs/diagrams/roadmap.svg
          python3 .github/scripts/render_kanban.py --src README.md --section Roadmap \
            --title "Roadmap" --theme dark --out docs/diagrams/roadmap-dark.svg
          python3 .github/scripts/render_heatmap.py --git . --weeks 26 \
            --out docs/diagrams/activity.svg
          python3 .github/scripts/render_heatmap.py --git . --weeks 26 --theme dark \
            --out docs/diagrams/activity-dark.svg
          python3 .github/scripts/render_timeline.py --git . --last 8 \
            --out docs/diagrams/timeline.svg
          python3 .github/scripts/render_timeline.py --git . --last 8 --theme dark \
            --out docs/diagrams/timeline-dark.svg
          python3 .github/scripts/render_deployment.py --src docs/data/deployment.json \
            --out docs/diagrams/deploy.svg
          python3 .github/scripts/render_deployment.py --src docs/data/deployment.json \
            --theme dark --out docs/diagrams/deploy-dark.svg

      # xmllint is not installed on ubuntu-24.04 runners: the previous revision of
      # this job died with exit 127 before a single check ran. Parse in Python.
      - name: verify assets are GitHub-safe and legible
        run: |
          python3 - <<'PY'
          import glob, re, sys, xml.dom.minidom as minidom
          bad = 0
          for f in sorted(glob.glob("docs/diagrams/*.svg")):
              minidom.parse(f)
              src = open(f, encoding="utf-8").read()
              if re.search(r'foreignObject|<script|@import|https?://[^"<]*\.(png|jpg|woff2?)', src):
                  print("forbidden or remote asset in", f)
                  bad = 1
          sys.exit(bad)
          PY
          python3 .github/scripts/verify_contrast.py docs/diagrams/*.svg

      - name: verify determinism (a hand-edited SVG fails here)
        run: |
          python3 .github/scripts/render_kanban.py --src README.md --section Roadmap \
            --title "Roadmap" --out /tmp/roadmap.svg
          cmp /tmp/roadmap.svg docs/diagrams/roadmap.svg
          python3 .github/scripts/render_heatmap.py --git . --weeks 26 --out /tmp/activity.svg
          cmp /tmp/activity.svg docs/diagrams/activity.svg

      - name: commit diagrams back
        # only on main: a workflow_dispatch from a branch must never push to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams
          git diff --staged --quiet || git commit -m "docs: regenerate diagrams [skip ci]"
          git push origin "HEAD:main"

  changelog:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generate release notes
        run: |
          BASE=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "base=${BASE:-<initial>} head=${GITHUB_REF_NAME}"
          python3 .github/scripts/changelog_local.py --git . \
            ${BASE:+--from "$BASE"} --to "$GITHUB_REF_NAME" \
            --version "$GITHUB_REF_NAME" --date "$(date -u +%F)" \
            --repo "$GITHUB_REPOSITORY" --exclude chore,ci,test \
            --legacy-map "$LEGACY_MAP" --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: prepend to CHANGELOG.md (never re-render history)
        run: |
          python3 .github/scripts/changelog_prepend.py \
            --notes "$RUNNER_TEMP/notes.md" --file CHANGELOG.md

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: commit CHANGELOG back
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: changelog ${GITHUB_REF_NAME} [skip ci]"
          git push origin "HEAD:main"
