name: Build OpenWrt Wayne

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Tags do NOT rebuild -- the release job reuses the main-branch build's
    # artifacts for the same commit. One commit = one compile, no wasted runs.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cpio zip unzip wget python3 libncurses5-dev libssl-dev bc flex bison \
            libelf-dev lz4 ccache

      # ---- Toolchain: EXACT same combo as DevHamid/Kernel_Action (proven) ----
      - name: Download AOSP clang (r547379)
        run: |
          mkdir -p tc/clang-aosp
          wget -q -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r547379.tar.gz"
          tar -C tc/clang-aosp -xzf clang.tar.gz
          ls tc/clang-aosp/bin/ | head -5

      - name: Download AOSP gcc (android-12.1.0_r27) — EXACT Ka_build.yml recipe
        run: |
          mkdir -p tc/gcc-64 tc/gcc-32
          # Download from android.googlesource.com (same URLs as Ka_build.yml lines 139-147)
          wget -q -O gcc-aarch64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
          tar -C tc/gcc-64/ -zxvf gcc-aarch64.tar.gz
          ls tc/gcc-64/

          wget -q -O gcc-arm.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
          tar -C tc/gcc-32/ -zxvf gcc-arm.tar.gz
          ls tc/gcc-32/

          # Set CROSS_COMPILE for 64-bit and 32-bit (Ka_build.yml pattern)
          echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/tc/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/tc/gcc-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          # Verify binaries exist
          ls -l tc/gcc-64/bin/ | grep gcc || echo "ERROR: gcc binary NOT in bin/"
          ls -l tc/gcc-32/bin/ | grep gcc || echo "ERROR: gcc binary NOT in bin/"

      - name: Download ImmortalWrt rootfs (21.02.7 armvirt/64)
        run: |
          mkdir -p rootfs
          wget -q \
            https://downloads.immortalwrt.org/releases/21.02.7/targets/armvirt/64/immortalwrt-21.02.7-armvirt-64-default-rootfs.tar.gz \
            -O rootfs/openwrt-rootfs.tar.gz
          ls -lh rootfs/openwrt-rootfs.tar.gz

      - name: Download busybox-static (aarch64, Alpine prebuilt)
        run: |
          mkdir -p tc
          wget -q \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/busybox-static-1.37.0-r20.apk \
            -O tc/busybox.apk
          # .apk is a tar.gz: bin/busybox.static inside (verified layout)
          tar -xzf tc/busybox.apk -C tc bin/busybox.static
          mv tc/bin/busybox.static tc/busybox
          chmod +x tc/busybox
          # Runner is x86_64; this AArch64 binary must NOT execute here.
          readelf -h tc/busybox | grep 'Machine:.*AArch64'

      - name: Assemble debug initramfs (tiny shell)
        run: |
          mkdir -p build/debug/bin build/debug/dev build/debug/proc build/debug/sys build/debug/tmp build/debug/etc
          cp tc/busybox build/debug/bin/busybox
          for applet in sh ash mount umount mknod ls cat dmesg head tail sleep echo mkdir ln rm grep setsid cttyhack reboot poweroff; do
            ln -sf busybox build/debug/bin/$applet
          done
          cp overlay-debug/init build/debug/init
          chmod +x build/debug/init
          # Composite USB gadget builder (acm + rndis); g_serial is gone (M5).
          cp overlay-common/usb-gadget.sh build/debug/usb-gadget.sh
          chmod +x build/debug/usb-gadget.sh
          (cd build/debug && find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9 > ../debug-initramfs.cpio.gz)
          ls -lh build/debug-initramfs.cpio.gz

      - name: Assemble OpenWrt initramfs (full rootfs)
        run: |
          mkdir -p build/openwrt
          cd build/openwrt
          tar xzf ../../rootfs/openwrt-rootfs.tar.gz
          # Ensure /bin/sh exists for our /init shebang (busybox provides it)
          ln -sf busybox bin/sh
          # Serial login on the configfs acm.usb0 console (g_serial removed, M5)
          # (format: id:runlevels:action:process -- matches existing ttyS0 line)
          echo 'ttyGS0::askfirst:/usr/libexec/login.sh' >> etc/inittab
          # Inject our /init wrapper (kernel -> procd handoff)
          cp ../../overlay-openwrt/init init
          chmod +x init
          # Composite USB gadget builder (acm + rndis); g_serial is gone (M5).
          cp ../../overlay-common/usb-gadget.sh usb-gadget.sh
          chmod +x usb-gadget.sh
          # Same gadget as a procd service (runs after /init already did it;
          # usb_gadget_up is idempotent). Installer inherits this via cp -a.
          cp ../../overlay-openwrt/usb-gadget.init etc/init.d/usb-gadget
          chmod +x etc/init.d/usb-gadget
          ln -sf ../init.d/usb-gadget etc/rc.d/S95usb-gadget
          # Safety net: a known-good static shell next to OpenWrt's busybox
          cp ../../tc/busybox bin/busybox-static
          chmod +x bin/busybox-static
          # Burn-in guard (screen off automation). These files lived in the
          # repo but were NEVER installed, so the panel stayed lit on the logo
          # for hours and the user had to run screen.sh by hand. Install them:
          #   /root/screen.sh            panel blank + backlight control helper
          #   /etc/init.d/burnin-guard   START=99: screen.sh guard 90 at boot
          # The installer (cp -a of this tree) inherits both automatically.
          mkdir -p root
          cp ../../scripts/screen.sh root/screen.sh
          chmod +x root/screen.sh
          # M6 host-mode tools: PROVEN standalone path, so ship the harness
          # instead of re-typing it over a serial console.
          #   /root/m6.sh            role switch w/ auto-rollback (60s)
          #   /root/vbus-host-test.sh  detached VBUS + enumeration probe
          cp ../../scripts/m6-roleswitch.sh root/m6.sh
          cp ../../scripts/vbus-host-test.sh root/vbus-host-test.sh
          chmod +x root/m6.sh root/vbus-host-test.sh
          # M7 probe: answers "can 4.19 run Docker?" with /proc + real mounts
          # instead of a defconfig read. Read-only except temp probe objects.
          cp ../../scripts/m7-docker-probe.sh root/m7.sh
          chmod +x root/m7.sh
          cp ../../overlay-openwrt/etc/init.d/burnin-guard etc/init.d/burnin-guard
          chmod +x etc/init.d/burnin-guard
          ln -sf ../init.d/burnin-guard etc/rc.d/S99burnin-guard
          echo "burnin guard installed: $(ls -l etc/rc.d/S99burnin-guard)"
          (find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9 > ../openwrt-initramfs.cpio.gz)
          ls -lh ../openwrt-initramfs.cpio.gz

      - name: Clone kernel source (with KernelSU submodule)
        run: |
          git clone --recurse-submodules --depth=1 \
            https://github.com/DevHamid/LKGeek_sdm660.git \
            -b build-all-rekernel kernel
          # drivers/kernelsu is a SYMLINK into the KernelSU submodule; a broken
          # symlink makes drivers/Kconfig:242 fail with "can't open file".
          test -f kernel/drivers/kernelsu/Kconfig \
            || { echo "FATAL: drivers/kernelsu/Kconfig missing (submodule fetch failed)"; \
                 ls -la kernel/drivers/kernelsu; exit 1; }
          echo "KernelSU Kconfig present:"; head -5 kernel/drivers/kernelsu/Kconfig

      - name: Apply OpenWrt config fragment
        run: |
          cd kernel
          cat ../kernel-config-fragment.txt >> arch/arm64/configs/vendor/wayne-oss-perf_defconfig
          echo "--- last 12 lines of defconfig now: ---"
          tail -n 12 arch/arm64/configs/vendor/wayne-oss-perf_defconfig

      # M6 VBUS root-cause fix. dwc3_otg_start_host() raises the OTG 5V boost
      # ONLY through devm_regulator_get_optional(dev, "vbus_dwc3"); the stock
      # ssusb@a800000 DT node never declares that supply, so smb2-vbus stays
      # disabled in host mode and no downstream device enumerates. Android
      # hides this because its userspace USB HAL enables smb2-vbus itself;
      # OpenWrt has no such HAL. Wire the regulator into the node.
      - name: Apply M6 VBUS DT fix (vbus_dwc3-supply)
        run: |
          cd kernel
          sh ../patches/usb3-vbus-dwc3-supply.sh
          echo "--- verify in tree ---"
          grep -n "vbus_dwc3-supply" arch/arm64/boot/dts/vendor/qcom/sdm660-common.dtsi

      # v0.9.7 shipped the DT fix but host mode REGRESSED on-device: the supply
      # is now valid, so regulator_enable() actually runs, and when the charger
      # refuses it dwc3_otg_start_host() returns BEFORE dwc3_host_init() -> no
      # xHCI at all (usb_devs empty). Make a VBUS failure non-fatal so host mode
      # always comes up, and log the rc the charger hid (its smblib_err() is
      # compiled out). Both patches are idempotent.
      - name: Apply M6 VBUS non-fatal + charger diagnostics
        run: |
          cd kernel
          sh ../patches/dwc3-vbus-nonfatal.sh
          sh ../patches/charger-vbus-diag.sh
          echo "--- verify in tree ---"
          grep -n "M6: vbus failure is non-fatal" drivers/usb/dwc3/dwc3-msm.c
          grep -n "M6 diag" drivers/power/supply/qcom/smb-lib.c

      - name: Download mkbootimg tools
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkboot -b master-kernel-build-2022

      # ---- v0.7 DONOR CONTROL -------------------------------------------------
      # Repack the donor's KNOWN-GOOD payload (donor kernel + donor Android
      # ramdisk) through OUR packer. No kernel build involved.
      # Device test of THIS image answers one question:
      #   boots    -> our packer produces bootloader-acceptable images;
      #               the failures must come from kernel/initramfs payloads.
      #   bootloops-> our packer/header output is rejected on-device despite
      #               being byte-faithful to the donor on the host.
      # Donor URL is PINNED to commit c947c2c (the exact boot.img proven to
      # boot on this phone) so the control cannot drift with the branch.
      - name: Donor control (repack known-good donor payload, no kernel build)
        run: |
          wget -q https://github.com/DevHamid/Kernel_Action/raw/c947c2c04f1445437f507f2b138c34e918d3d54f/boot/boot.img -O donor-boot.img
          python3 mkboot/unpack_bootimg.py --boot_img donor-boot.img --out donor-unpacked
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            donor-unpacked/kernel donor-unpacked/ramdisk build/donor-control.img
          # Host-level faithfulness gate (real prefix + zero tail), per round-trip rule
          python3 - <<'PYEOF'
          import pathlib
          donor = pathlib.Path('donor-boot.img').read_bytes()
          rep   = pathlib.Path('build/donor-control.img').read_bytes()
          assert donor[:len(rep)] == rep, "repacked image diverges from donor real bytes"
          assert set(donor[len(rep):]) <= {0}, "donor tail is not zero padding"
          print(f"donor-control.img {len(rep)} bytes: byte-faithful to donor prefix")
          PYEOF
          ls -lh build/donor-control.img

      - name: Build kernel (Image.gz-dtb, clang — same recipe as Kernel_Action)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/tc/clang-aosp/bin:$PATH"
          export KBUILD_BUILD_HOST=Github-Action
          # CC/LD/CLANG_TRIPLE must be COMMAND-LINE make args, not exports:
          # kernel Makefile uses plain '=' (recursive), which exports do NOT override.
          # Kernel_Action line 262 passes CC=clang on BOTH defconfig and build commands.
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld \
            ${{ env.GCC_64 }} ${{ env.GCC_32 }} \
            vendor/wayne-oss-perf_defconfig
          # Job logs are admin-only (403 for this account), so a failed build
          # told us nothing but "exit code 2". Emit the actual compiler errors
          # as check-run annotations -- that API IS readable -- so the break is
          # diagnosable without repo admin.
          set +e
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- LD=ld.lld \
            ${{ env.GCC_64 }} ${{ env.GCC_32 }} \
            Image.gz-dtb dtbs > /tmp/kbuild.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|Error [0-9]|undefined symbol|No rule to make" /tmp/kbuild.log \
              | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done
            echo "--- tail ---"
            tail -n 30 /tmp/kbuild.log
            exit "$rc"
          fi
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          ls out/arch/arm64/boot/dts/vendor/qcom/ | grep -i wayne || echo "WARN: wayne dtb missing"

      - name: Dump resolved kernel config (OTG/F2FS/SQUASHFS ground truth)
        run: |
          # The fragment is APPENDED to the vendor defconfig, but kconfig may
          # still drop an option whose dependencies are unmet (e.g. a symbol
          # that needs a parent we did not enable). This step prints what the
          # build ACTUALLY resolved, so we stop guessing about OTG support.
          cd kernel
          echo "===== USB / OTG / EXTCON / TYPEC ====="
          grep -E "^(CONFIG_(EXTCON|TYPEC|USB_DWC3|USB_XHCI_HCD|USB_STORAGE|USB_UAS|USB_ACM|USB_OTG|USB_GADGET|USB_CONFIGFS|USB_G_SERIAL|USB_LIBCOMPOSITE)[A-Z0-9_]*)" out/.config | sort | tee ../config-usb.txt
          echo "===== FILESYSTEMS ====="
          grep -E "^(CONFIG_(F2FS_FS|EXT4_FS|SQUASHFS|OVERLAY_FS|BLK_DEV_SD|SCSI|VFAT_FS|MSDOS_FS)[A-Z0-9_]*)" out/.config | sort | tee -a ../config-usb.txt
          echo "===== HARD GATE: DWC3 dual-role + EXTCON must be y ====="
          for sym in CONFIG_EXTCON CONFIG_USB_DWC3_DUAL_ROLE CONFIG_USB_XHCI_HCD CONFIG_USB_STORAGE CONFIG_BLK_DEV_SD; do
            if grep -q "^${sym}=y" out/.config; then
              echo "PASS: ${sym}=y"
            else
              echo "FAIL: ${sym} is NOT =y -- OTG host mode will not work"
              grep -E "^# ${sym} is not set|^${sym}=" out/.config || true
            fi
          done

      # M5 gate: the WHOLE point of this build is that g_serial is gone and the
      # configfs composite gadget (acm + rndis) can claim the single UDC. If
      # USB_G_SERIAL still resolves =y, the flash is wasted -- fail here instead.
      - name: M5 gate (g_serial gone, configfs acm+rndis present)
        run: |
          cd kernel
          fail=0
          if grep -q '^CONFIG_USB_G_SERIAL=y' out/.config; then
            echo "FAIL: CONFIG_USB_G_SERIAL=y -- legacy g_serial will grab the UDC again"
            fail=1
          else
            echo "PASS: USB_G_SERIAL not =y (g_serial removed)"
          fi
          for sym in CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_ACM CONFIG_USB_CONFIGFS_RNDIS CONFIG_USB_LIBCOMPOSITE CONFIG_USB_GADGET; do
            if grep -q "^${sym}=y" out/.config; then
              echo "PASS: ${sym}=y"
            else
              echo "FAIL: ${sym} is NOT =y -- composite gadget cannot be built"
              grep -E "^# ${sym} is not set|^${sym}=" out/.config || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::M5 gate failed: composite USB gadget would not work on device. Not flashing this."
            exit 1
          fi
          echo "M5 gate PASSED: g_serial gone, configfs acm+rndis ready"

      - name: Pack boot images (kernel + our initramfs)
        run: |
          # Reuse the SAME pinned donor image as the control step
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            build/debug-initramfs.cpio.gz build/debug-boot.img
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            build/openwrt-initramfs.cpio.gz build/openwrt-boot.img
          # --- BISECT 1: OUR kernel + DONOR's known-good Android ramdisk ---
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            donor-unpacked/ramdisk build/bisect-kernel.img
          # --- BISECT 2: DONOR's known-good kernel + OUR debug initramfs ---
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            donor-unpacked/kernel \
            build/debug-initramfs.cpio.gz build/bisect-initramfs.img
          ls -lh build/*.img

      - name: Assemble installer initramfs (v0.9 eMMC persistent rootfs)
        run: |
          # Reuse the SAME OpenWrt rootfs we already assemble, but replace /init
          # with the self-installer. Everything else is byte-identical, so the
          # installer runs with mkfs.ext4/tar already present in the live system.
          rm -rf build/installer
          cp -a build/openwrt build/installer
          cp overlay-installer/init build/installer/init
          chmod +x build/installer/init
          # init.d service copied into the persistent rootfs by the installer
          # (usb-gadget.sh is already here, inherited from build/openwrt).
          cp overlay-openwrt/usb-gadget.init build/installer/usb-gadget.init
          chmod +x build/installer/usb-gadget.init
          echo "[v0.9.4] installer /init sha256: $(sha256sum overlay-installer/init | cut -d' ' -f1)"
          grep -c 'exec >/dev/console' overlay-installer/init || echo 'no exec >/dev/console (good)'
          (cd build/installer && find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9 > ../installer-initramfs.cpio.gz)
          ls -lh build/installer-initramfs.cpio.gz

      - name: Pack installer boot image (rootfs on eMMC userdata)
        run: |
          # The installer mounts /dev/mmcblk0p64 BY NAME inside its own /init, so
          # it needs NO kernel root= argument.
          #
          # v0.9 shipped this with scripts/pack-boot-root.py, which APPENDED
          # "root=/dev/mmcblk0p64 rootwait rootfstype=ext4" to the cmdline. The
          # kernel obeyed that root=, tried to mount the not-yet-formatted
          # userdata as its root, and panicked BEFORE the initramfs /init ran --
          # so the phone rebooted straight back to Android and ttyACM0 never
          # came up. Empirically confirmed: two images from the same donor differ
          # in exactly ONE place (46 bytes, all inside the cmdline); kernel and
          # ramdisk are byte-identical.
          #
          # Use the plain packer: it preserves the donor cmdline VERBATIM.
          python3 scripts/pack-boot.py mkboot donor-boot.img \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            build/installer-initramfs.cpio.gz \
            build/installer-boot.img
          # CI GATE: rebuild + unpack, prove kernel+ramdisk byte-identical and
          # that the cmdline equals the donor's (no root=/dm= the kernel obeys).
          python3 scripts/check-pack.py mkboot donor-boot.img \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            build/installer-initramfs.cpio.gz
          ls -lh build/installer-boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayne-openwrt
          path: |
            build/debug-boot.img
            build/openwrt-boot.img
            build/bisect-kernel.img
            build/bisect-initramfs.img
            build/donor-control.img
            build/debug-initramfs.cpio.gz
            build/openwrt-initramfs.cpio.gz
            config-usb.txt
            build/installer-boot.img
            build/installer-initramfs.cpio.gz

      # ---- v0.9.3 OTG HARD GATE (deliberately runs AFTER the upload) --------
      # The config-dump step above only PRINTS "FAIL:" -- it never exits, so a
      # build where kconfig silently dropped CONFIG_EXTCON (e.g. a `choice`
      # conflict on USB_DWC3 mode) would still go GREEN and upload a non-OTG
      # kernel. That is a false safety net; this step makes it a RED build.
      #
      # Runs LAST on purpose: images are already built and uploaded, so a red X
      # here still leaves usable Course B (eMMC installer) artifacts. It only
      # tells you NOT to attempt Course A (OTG host) until the fragment is fixed.
      - name: OTG hard gate (fail build if EXTCON/DWC3 did not resolve)
        run: |
          cd kernel
          fail=0
          for sym in CONFIG_EXTCON CONFIG_USB_DWC3_DUAL_ROLE CONFIG_USB_XHCI_HCD CONFIG_USB_STORAGE CONFIG_BLK_DEV_SD CONFIG_EXT4_FS; do
            if grep -q "^${sym}=y" out/.config; then
              echo "PASS: ${sym}=y"
            else
              echo "FAIL: ${sym} is NOT =y"
              grep -E "^# ${sym} is not set|^${sym}=" out/.config || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::OTG hard gate failed: the OTG fragment did not resolve. Course A (OTG host) will not work; artifacts were still uploaded for Course B."
            exit 1
          fi
          echo "OTG hard gate PASSED: all OTG symbols resolved =y"

  # ---- Tag-triggered Release (NO rebuild) ----------------------------------
  # Push a tag like `git tag v0.9.5 && git push origin v0.9.5`. This job does
  # NOT compile anything: it waits for the main-branch build of the SAME commit
  # to go green, downloads that run's `wayne-openwrt` artifact, and publishes a
  # Release with the boot images attached and the matching CHANGELOG section as
  # release notes. Uses the built-in GITHUB_TOKEN (no PAT, no extra secret).
  #
  # Why: previously a tag triggered a second full ~15 min kernel build of a
  # commit that main had already built -- same SHA, two compiles, wasted runner
  # minutes. Now one commit = at most one build.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the main-branch build of this commit (reuse, don't rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          echo "Waiting for a successful main build of $SHA (this job never rebuilds)."
          RUN_ID=""
          for i in $(seq 1 70); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --limit 30 \
              --json databaseId,event,status,conclusion,workflowName \
              --jq '[.[] | select(.event=="push" and .conclusion=="success"
                                  and .databaseId != (env.GITHUB_RUN_ID|tonumber))][0].databaseId' 2>/dev/null || true)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Reusing build run $RUN_ID"; break
            fi
            echo "[$((i*30))s] still waiting for a green build of $SHA…"
            sleep 30
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful build found for $SHA after ~35 min. Build/push main first, then tag."
            exit 1
          fi
          echo "$RUN_ID" > /tmp/runid

      - name: Download that run's artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$(cat /tmp/runid)" --repo "$GITHUB_REPOSITORY" -n wayne-openwrt -D dist
          echo "--- downloaded ---"
          find dist -type f -printf '%p  %s bytes\n'
          # The artifact keeps its internal build/ dir, so flatten the images
          # into out/ — a single flat glob is what the release step uploads.
          mkdir -p out
          find dist -type f -name '*.img' -exec cp -v {} out/ \;
          echo "--- release assets ---"
          ls -l out/

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib
          tag = os.environ['GITHUB_REF_NAME']
          text = pathlib.Path('CHANGELOG.md').read_text()
          m = re.compile(r'^## \[' + re.escape(tag) + r'\]', re.M).search(text)
          if m:
              nxt = re.compile(r'^## ', re.M).search(text, m.end())
              body = text[m.start(): nxt.start() if nxt else len(text)].strip()
          else:
              body = text.strip()
          body += "\n\n---\nBoot images are attached below (no install needed: `fastboot boot <image>`).\n"
          pathlib.Path('release-notes.md').write_text(body)
          print(body[:400])
          PYEOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: out/*.img
          fail_on_unmatched_files: true
